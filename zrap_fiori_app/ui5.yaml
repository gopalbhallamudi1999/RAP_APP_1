specVersion: "3.1"
metadata:
  name: zrap.fiori.app
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /sap
            url: https://<YOUR-ABAP-SYSTEM-HOST>
            # For BTP ABAP Environment use: destination: <YOUR_DESTINATION>
        ui5:
          path: [/resources, /test-resources]
          url: https://ui5.sap.com
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300

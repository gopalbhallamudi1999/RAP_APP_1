specVersion: "3.1"
metadata:
  name: zrap.fiori.app
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://<YOUR-ABAP-SYSTEM-HOST>
          client: "100"          # remove for BTP ABAP Environment
          # scp: true            # uncomment for BTP ABAP Environment
        app:
          name: ZRAP_FIORI_APP   # BSP name, max 15 chars, Z/Y namespace
          description: RAP Fiori App
          package: ZRAP_PACKAGE  # use $TMP for local
          transport: <TRANSPORT_REQUEST>
        exclude:
          - /test/
